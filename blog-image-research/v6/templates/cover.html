<!doctype html>
<!-- Honest Taskers covers v6: one fixed series frame, the way Stripe, Mercury and Calendly keep every cover recognisable.
     FIXED on every cover (never changes per article):
       background   the current blue-to-cyan gradient, always light on the left, electric blue on the right
       kicker       white pill with a teal dot, top-left at (140, 64), the article type in capitals
       headline     Sequel Sans 700, dark ink, x 140, y 112, max width 450, max 3 lines (54px, steps down to 44px if needed)
       stage card   one white card, x 640 y 64, 400 x 250, radius 24, the same shadow
       badge        one 92px blue circle with a white subject icon, overlapping the card's top-right corner
       logo         Honest Taskers wordmark bottom-left (below the listing panel, shows on social shares)
     VARIES per article: the kicker words, the headline words, the badge icon, and what is drawn inside the card.
     ?spec={"kicker","headline","icon","visual", ...visual data}. Key content stays in the listing band (x 115-1085, y < 353). -->
<html><head><meta charset="utf-8"><script src="../../v3/templates/icons.js"></script>
<style>
  :root { --blue:#2345ff; --deep:#162da1; --teal:#2dd0e8; --ink:#0b1440; --mut:#6b7396; --font:"Sequel Sans","Inter Display","Inter","Helvetica Neue",Arial,sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  .c { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: var(--font); color: var(--ink); }
  .abs { position: absolute; }
  .kick { position: absolute; left: 140px; top: 64px; display: flex; align-items: center; gap: 10px; padding: 9px 18px 9px 14px; border-radius: 999px;
          background: #fff; font: 600 17px var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--blue); box-shadow: 0 6px 16px rgba(10,30,140,.10); }
  .kick i { width: 12px; height: 12px; border-radius: 50%; background: var(--teal); }
  .head { position: absolute; left: 140px; top: 116px; width: 450px; font-weight: 700; font-size: 54px; line-height: 1.04; letter-spacing: -.025em; color: var(--ink); }
  .stage { position: absolute; left: 640px; top: 64px; width: 400px; height: 250px; border-radius: 24px; background: #fff; overflow: hidden;
           padding: 24px 26px; box-shadow: 0 24px 54px rgba(10,30,140,.24), 0 2px 6px rgba(10,30,140,.08); }
  .badge { position: absolute; left: 996px; top: 20px; width: 92px; height: 92px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
           background: linear-gradient(135deg, #2e64fd, #1344fd); border: 6px solid #fff; box-shadow: 0 14px 30px rgba(10,30,140,.30); }
  .logo { position: absolute; left: 140px; top: 548px; height: 40px; }
  /* card vocabulary shared by every visual */
  .t { font: 700 22px var(--font); color: var(--ink); }
  .s { font: 500 16px var(--font); color: var(--mut); }
  .lab { font: 600 14px var(--font); color: var(--mut); text-transform: uppercase; letter-spacing: .07em; }
  .row { display: flex; align-items: center; gap: 12px; }
  .sp { justify-content: space-between; }
  .pill { padding: 5px 12px; border-radius: 999px; font: 600 15px var(--font); white-space: nowrap; }
  .ok { background: rgba(45,208,232,.18); color: #0a8496; }
  .bl { background: #eef1ff; color: var(--blue); }
  .dk { background: var(--deep); color: #fff; }
  .bar { height: 10px; border-radius: 5px; background: #e3e7f6; }
  .chip { width: 44px; height: 44px; border-radius: 12px; background: #eef1ff; display: flex; align-items: center; justify-content: center; flex: none; }
  .panel { position: absolute; overflow: hidden; }
  .panel img { position: absolute; display: block; }
</style></head>
<body><div class="c" id="c"></div>
<script>
  const s = htSpec({ kicker: 'Software & EHR', headline: 'Scribe in Epic, start to finish', icon: 'stethoscope', visual: 'note' });
  const c = document.getElementById('c');
  const B = '#2345ff', E = '#1344fd', CY = '#02d0fd', SKY = '#a9d2f7', T = '#2dd0e8', INK = '#0b1440', D0 = '#162da1';
  const add = (cls, html = '', st = {}) => { const e = document.createElement('div'); e.className = cls; Object.assign(e.style, st); e.innerHTML = html; c.appendChild(e); return e; };
  const ico = (n, size, stroke = 9, col = B, acc = T) => htIcon(n, size, stroke, col, acc);
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  // 1 Background: the current gradient, one direction only.
  add('abs', '', { inset: 0, background: `linear-gradient(115deg, #f2f8ff 0%, ${SKY} 30%, #5b9efd 55%, ${E} 82%, #0d3fd8 100%)` });
  add('abs', '', { inset: 0, background: `radial-gradient(60% 70% at 92% 108%, ${CY} 0%, rgba(2,208,253,.55) 35%, transparent 70%)` });
  add('abs', '', { inset: 0, background: 'radial-gradient(45% 55% at 15% 10%, rgba(255,255,255,.85), transparent 70%)' });
  add('abs', `<svg width="1200" height="630"><path d="M560 630 C 760 520, 900 470, 1200 330 L1200 630Z" fill="${CY}" opacity=".55"/>
    <path d="M700 630 C 860 560, 980 520, 1200 440 L1200 630Z" fill="#7fe9ff" opacity=".45"/>
    ${[350, 395, 440].map((y, i) => `<rect x="${660 + i * 40}" y="${y}" width="${420 - i * 70}" height="3" rx="1.5" fill="#fff" opacity="${.4 - i * .1}"/>`).join('')}</svg>`, { left: 0, top: 0 });

  // 2 Text: kicker + headline, fixed position; size steps down only to keep three lines.
  add('kick', `<i></i>${esc(s.kicker)}`);
  const h = add('head', esc(s.headline));
  for (const size of [54, 50, 46, 44]) { h.style.fontSize = size + 'px'; if (h.offsetHeight <= size * 1.04 * 3 + 2) break; }

  // 3 Logo (bottom-left, below the listing panel).
  const lg = document.createElement('img'); lg.src = '../../v3/assets/ht-logo.svg'; lg.className = 'logo'; c.appendChild(lg);

  // 4 Stage card: the one place that changes per article.
  const V = {};
  // Software/EHR: a note being filled in the EHR.
  V.note = d => `<div class="row sp" style="padding-right:64px"><span class="t">${d.title || 'Visit note'}</span><span class="pill bl">${d.tag || 'Epic'}</span></div>
    ${(d.rows || ['Chief complaint', 'History', 'Plan']).map((t, i) => `<div class="lab" style="margin-top:14px">${t}</div><div class="bar" style="margin-top:6px;width:${[300, 250, 190][i % 3]}px"></div>`).join('')}
    <div style="margin-top:16px"><span class="pill ok">${d.status || 'Ready to sign'}</span></div>`;
  // Cost guides: what the price is made of, no figures.
  V.cost = d => `<div class="t" style="padding-right:64px">${d.title}</div><div class="s" style="margin-top:4px">${d.sub || 'Cost guide'}</div>
    ${d.rows.map((t, i) => `<div class="row sp" style="margin-top:12px;font:600 18px var(--font)"><span>${t}</span><span class="bar" style="width:${[120, 90, 60, 100][i % 4]}px;background:${[D0, B, T, '#c9d2f5'][i % 4]}"></span></div>`).join('')}`;
  // Calls / triage: an incoming call sorted by urgency.
  V.call = d => `<div class="row"><div class="chip" style="background:${B}">${ico('phone', 28, 9, '#fff', T)}</div><div><div class="t">${d.title}</div><div class="s">${d.sub}</div></div></div>
    ${d.rows.map(([t, p], i) => `<div class="row sp" style="margin-top:13px;font:600 18px var(--font)"><span>${t}</span><span class="pill ${['dk', 'bl', 'ok'][i % 3]}">${p}</span></div>`).join('')}`;
  // Compliance: a record with masked fields and the safeguards.
  V.masked = d => `<div class="t" style="padding-right:64px">${d.title}</div>
    ${d.rows.map(([l, w]) => `<div class="row" style="margin-top:12px"><span class="lab" style="width:120px">${l}</span><span style="height:14px;width:${w}px;border-radius:4px;background:${INK};opacity:.85"></span></div>`).join('')}
    <div class="row" style="margin-top:16px;gap:8px">${d.chips.map(t => `<span class="pill ok">${t}</span>`).join('')}</div>`;
  // Comparison: two columns inside the one card, the left muted.
  V.versus = d => `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%">
    ${[d.a, d.b].map((x, k) => `<div style="border-radius:16px;padding:16px;background:${k ? 'rgba(45,208,232,.14)' : '#f2f4fa'}">
      <div class="lab" style="color:${k ? '#0a8496' : '#7a819f'}">${k ? 'Option B' : 'Option A'}</div><div class="t" style="font-size:19px;margin-top:6px;color:${k ? INK : '#4a5175'}">${x.title}</div>
      ${x.rows.map(t => `<div style="margin-top:9px;font:600 15px var(--font);color:${k ? INK : '#6b7396'}">${k ? '+' : '–'} ${t}</div>`).join('')}</div>`).join('')}</div>`;
  // Best-of lists: a ranked list.
  V.ranked = d => `<div class="lab" style="padding-right:64px">${d.title}</div>
    ${[0, 1, 2].map(i => `<div class="row" style="margin-top:14px;padding:10px 12px;border-radius:14px;background:${i ? '#f5f7fd' : '#eef1ff'}"><b style="font:700 22px var(--font);color:${B};width:36px">#${i + 1}</b>
      <div style="flex:1"><div class="bar" style="width:${[170, 150, 130][i]}px;background:${INK};opacity:.8"></div><div class="bar" style="margin-top:7px;width:${[120, 100, 140][i]}px"></div></div>${ico(d.icons[i], 28)}</div>`).join('')}`;
  // Operations / trends: a line climbing, with labels.
  V.trend = d => `<div class="t" style="padding-right:64px">${d.title}</div><div class="s">${d.sub}</div>
    <svg width="348" height="120" style="margin-top:10px"><path d="M0 110 H348 M0 60 H348 M0 10 H348" stroke="#eef1ff" stroke-width="2"/>
      <path d="M6 100 L80 92 L150 74 L230 50 L330 18" stroke="${B}" stroke-width="5" fill="none" stroke-linejoin="round"/><circle cx="330" cy="18" r="9" fill="${T}" stroke="#fff" stroke-width="4"/></svg>
    <div class="row" style="gap:8px;margin-top:6px">${d.chips.map((t, i) => `<span class="pill ${i === d.chips.length - 1 ? 'ok' : 'bl'}">${t}</span>`).join('')}</div>`;
  // Guides: a profile record for the subject.
  V.profile = d => `<div class="row" style="padding-right:64px"><div class="chip">${ico(d.icon2 || s.icon, 30)}</div><div><div class="t">${d.title}</div><div class="s">${d.sub}</div></div></div>
    ${d.rows.map(([t, p]) => `<div class="row sp" style="margin-top:14px;font:600 18px var(--font)"><span>${t}</span><span class="pill ok">${p}</span></div>`).join('')}`;
  // Role explainers: a photo strip of the person + the day's timeline.
  V.day = d => `<div class="panel" id="ph" style="left:0;top:0;width:130px;height:250px"></div><div style="margin-left:118px">
    <div class="lab">${d.title}</div>${d.rows.map(([t, x]) => `<div style="margin-top:12px"><b style="font:700 16px var(--font);color:${B}">${t}</b><div style="font:600 17px var(--font);margin-top:2px">${x}</div></div>`).join('')}</div>`;
  // Delegation / task lists: tasks handed over, each ticked off.
  V.tasks = d => `<div class="row" style="padding-right:64px"><span class="t">${d.title}</span></div>
    ${d.rows.map((t, i) => `<div class="row sp" style="margin-top:14px;padding:10px 12px;border-radius:12px;background:${i < d.done ? 'rgba(45,208,232,.14)' : '#f5f7fd'};font:600 17px var(--font)"><span>${t}</span><span class="pill ${i < d.done ? 'ok' : 'bl'}" style="font-size:13px">${i < d.done ? 'Your VA' : 'Front desk'}</span></div>`).join('')}`;
  // Pay / regional guides: range bars by region (no figures).
  V.ranges = d => `<div class="t" style="padding-right:64px">${d.title}</div><div class="s">${d.sub}</div>
    ${d.rows.map(([r, a, b], i) => `<div class="row" style="margin-top:14px;font:600 16px var(--font)"><span style="width:130px">${r}</span><span style="flex:1;height:12px;border-radius:6px;background:#eef1ff;position:relative"><i style="position:absolute;left:${a * 100}%;width:${(b - a) * 100}%;top:0;bottom:0;border-radius:6px;background:${[D0, B, T][i % 3]}"></i></span></div>`).join('')}
    ${d.note ? `<div style="margin-top:18px"><span class="pill ok">${d.note}</span></div>` : ''}`;

  add('stage', (V[s.visual] || V.note)(s.data || {}));
  if (s.visual === 'day' && s.photo) {
    const p = document.getElementById('ph'), w = 130, hh = 250, k = Math.max(w / 1200, hh / 630) * 1.15, iw = 1200 * k, ih = 630 * k;
    let l = w / 2 - s.focal[0] / 100 * iw, t = 70 - s.focal[1] / 100 * ih; l = Math.min(0, Math.max(w - iw, l)); t = Math.min(0, Math.max(hh - ih, t));
    p.innerHTML = `<img src="../../v3/${s.photo}" style="width:${iw}px;height:${ih}px;left:${l}px;top:${t}px">`;
  }
  add('badge', ico(s.icon, 50, 9, '#fff', T));
</script></body></html>
