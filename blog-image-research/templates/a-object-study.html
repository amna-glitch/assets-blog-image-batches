<!doctype html>
<!-- Direction A: Object Study. One healthcare/admin object, drawn large in monoline, on a flat brand field.
     Spec: {"icon":"tooth","field":"deep"|"blue"|"light"} -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="icons.js"></script>
<style>
  .plate { position: absolute; left: 600px; top: 315px; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%; }
  .obj { left: 600px; top: 315px; width: 300px; height: 300px; margin: -150px 0 0 -150px; }
  .rule { position: absolute; left: var(--margin); right: var(--margin); top: 315px; height: 2px; }
</style></head>
<body><div class="canvas" id="c"><div class="rule" id="rule"></div><div class="plate" id="plate"></div><div class="center obj" id="obj"></div><div class="sig"></div></div>
<script>
  const s = htSpec({ icon: 'tooth', field: 'deep' });
  const fields = {
    deep:  { bg: '#162da1', plate: '#2345ff', ink: '#ffffff', rule: 'rgba(255,255,255,.14)' },
    blue:  { bg: '#2345ff', plate: '#3e59ff', ink: '#ffffff', rule: 'rgba(255,255,255,.18)' },
    light: { bg: '#eef1ff', plate: '#ffffff', ink: '#162da1', rule: '#ffffff' },
  };
  const f = fields[s.field] || fields.deep;
  const c = document.getElementById('c');
  c.style.background = f.bg;
  document.getElementById('plate').style.background = f.plate;
  document.getElementById('rule').style.background = f.rule;
  document.getElementById('obj').innerHTML = htIcon(s.icon, 300, 5, f.ink, '#2dd0e8');
  htGuides(c);
</script></body></html>
