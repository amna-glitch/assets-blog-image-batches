<!doctype html>
<!-- Direction D: Path. How-to, hiring, workflows inside software, task hand-offs.
     Three nodes joined by one continuous line; the last node is the outcome.
     Spec: {"steps":["phone","calendar","check"],"field":"blue"} -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="icons.js"></script>
<style>
  svg.line { position: absolute; left: 0; top: 0; }
  .node { position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
</style></head>
<body><div class="canvas" id="c"><svg class="line" id="ln" width="1200" height="630"></svg><div class="sig"></div></div>
<script>
  const s = htSpec({ steps: ['phone', 'calendar', 'check'], field: 'blue' });
  const c = document.getElementById('c');
  const bg = s.field === 'deep' ? '#162da1' : '#2345ff';
  c.style.background = bg;
  const pts = [[372, 390], [600, 240], [828, 390]];
  const [p0, p1, p2] = pts;
  // One continuous curve through the three nodes, entering from the left margin and leaving to the right.
  const d = `M72 390 C200 390 260 390 ${p0[0]} ${p0[1]} S ${p1[0]-120} ${p1[1]} ${p1[0]} ${p1[1]} S ${p2[0]-110} ${p2[1]} ${p2[0]} ${p2[1]} S 1060 390 1128 390`;
  document.getElementById('ln').innerHTML = `<path d="${d}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>`;
  s.steps.forEach((ic, i) => {
    const last = i === s.steps.length - 1;
    const n = document.createElement('div'); n.className = 'node';
    Object.assign(n.style, { left: pts[i][0] + 'px', top: pts[i][1] + 'px',
      background: last ? '#ffffff' : bg, border: last ? '0' : '4px solid #ffffff' });
    n.innerHTML = htIcon(ic, 84, 9, last ? '#2345ff' : '#ffffff', last ? '#2dd0e8' : '#ffffff');
    c.appendChild(n);
  });
  htGuides(c);
</script></body></html>
