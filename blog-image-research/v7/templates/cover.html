<!doctype html>
<!-- Honest Taskers covers v7: no words on the image. The visual tells the title.
     Shared by every cover (the consistency layer):
       - the HT gradient, measured from an average of 319 current article images: a see-through blue wash that is strongest
         top-right (electric blue), deeper blue bottom-left, a cyan band along the bottom, and a pale haze in the centre
       - Calendly-style transparency: frosted white glass shapes, see-through gradient capsules, ghosted oversized shapes
       - the brand icon set, the brand blues + teal, one soft blue shadow
     Varies per cover: the composition and the objects (72 scenes in scenes-*.js).
     ?spec={"id":"s01"}. Key content sits inside the listing band: x 115-1085, y 0-353. -->
<html><head><meta charset="utf-8"><script src="../../v3/templates/icons.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  .c { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: "Inter", Arial, sans-serif; }
  .abs { position: absolute; }
  .glass { position: absolute; background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(255,255,255,.42)); border: 1.5px solid rgba(255,255,255,.9);
           backdrop-filter: blur(14px) saturate(1.25); -webkit-backdrop-filter: blur(14px) saturate(1.25);
           box-shadow: 0 22px 50px rgba(19,68,253,.20), inset 0 1px 0 rgba(255,255,255,.95); }
  .solid { position: absolute; background: #fff; box-shadow: 0 22px 50px rgba(19,68,253,.20), 0 2px 6px rgba(19,68,253,.08); }
  .ctr { display: flex; align-items: center; justify-content: center; }
  .panel { position: absolute; overflow: hidden; }
  .panel img { position: absolute; display: block; }
</style></head>
<body><div class="c" id="c"></div>
<script>window.SCENES = {};</script>
<script src="scenes-a.js"></script><script src="scenes-b.js"></script><script src="scenes-c.js"></script><script src="scenes-d.js"></script>
<script>
  const s = htSpec({ id: 's01' });
  const c = document.getElementById('c');
  // Palette: brand kit + the colours measured from the current images.
  const P = { blue: '#2345ff', deep: '#162da1', mid: '#3e59ff', teal: '#2dd0e8', electric: '#1344fd', bright: '#2e64fd', cyan: '#02d0fd', aqua: '#55e0fa',
              sky: '#a9d2f7', ink: '#0b1440', mute: '#8a93b8', line: '#dfe5f7', white: '#ffffff' };
  const px = v => typeof v === 'number' ? v + 'px' : v;
  // add(className, style, html, parent) -> element. Numbers in style become px.
  const add = (cls, st = {}, html = '', parent = c) => { const e = document.createElement('div'); e.className = cls;
    for (const [k, v] of Object.entries(st)) e.style[k] = px(v); e.innerHTML = html; parent.appendChild(e); return e; };
  // svg(inner, x, y, w, h): an absolutely positioned SVG layer (default full canvas).
  const svg = (inner, x = 0, y = 0, w = 1200, h = 630) => add('abs', { left: x, top: y, width: w, height: h },
    `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" overflow="visible"><defs>${DEFS}</defs>${inner}</svg>`);
  // Shared SVG gradients usable as fill="url(#gB)" etc. in any scene.
  const DEFS = `<linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e64fd"/><stop offset="1" stop-color="#1344fd"/></linearGradient>
    <linearGradient id="gBC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1344fd"/><stop offset="1" stop-color="#02d0fd"/></linearGradient>
    <linearGradient id="gCap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".85"/><stop offset=".55" stop-color="#7fb2ff" stop-opacity=".45"/><stop offset="1" stop-color="#02d0fd" stop-opacity=".35"/></linearGradient>
    <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
    <linearGradient id="gGhost" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1344fd" flood-opacity=".22"/></filter>`;
  // ico(name, size, stroke, colour, accent): brand icon (names in icons.js).
  const ico = (n, size = 64, stroke = 8, col = P.blue, acc = P.teal) => htIcon(n, size, stroke, col, acc);
  // glass(x, y, w, h, radius, extraStyle, html): frosted see-through panel.  solid(): opaque white card.
  const glass = (x, y, w, h, r = 28, st = {}, html = '') => add('glass' + (html ? ' ctr' : ''), { left: x, top: y, width: w, height: h, borderRadius: r, ...st }, html);
  const solid = (x, y, w, h, r = 24, st = {}, html = '') => add('solid' + (html ? ' ctr' : ''), { left: x, top: y, width: w, height: h, borderRadius: r, ...st }, html);
  // tile(icon, cx, cy, size): glass rounded square centred on (cx, cy) holding a brand icon.
  const tile = (n, cx, cy, size = 120, st = {}) => glass(cx - size / 2, cy - size / 2, size, size, size * .28, st, ico(n, size * .56, 8));
  // capsules(x, y, count, w, h, gap, heights[]): Calendly-style see-through gradient capsules (bars), bottoms aligned at y + h.
  const capsules = (x, y, n, w = 46, h = 200, gap = 16, hs) => svg(Array.from({ length: n }, (_, i) => { const hh = hs ? hs[i % hs.length] * h : h;
    return `<rect x="${x + i * (w + gap)}" y="${y + h - hh}" width="${w}" height="${hh}" rx="${w / 2}" fill="url(#gCap)"/>`; }).join(''));
  // ghost(svgPathOrShape): oversized see-through white shape (Calendly's ghosted forms). Pass SVG markup using fill="url(#gGhost)".
  const ghost = inner => svg(inner);
  // stripes(x, y, w, n, gap): thin horizontal light streaks (from the current images / Calendly's Notetaker cover).
  const stripes = (x, y, w, n = 6, gap = 18, op = .5) => svg(Array.from({ length: n }, (_, i) => `<rect x="${x + (i % 2) * 30}" y="${y + i * gap}" width="${w - (i % 3) * 60}" height="6" rx="3" fill="#fff" opacity="${op - i * op / (n + 2)}"/>`).join(''));
  // photo(src, focal[x%,y%], x, y, w, h, tx, ty, zoom, radius): crop of an existing HT photo (v3/photos), focal point placed at (tx, ty) in the panel.
  function photo(src, focal, x, y, w, h, tx, ty, zoom = 1, radius = 0, st = {}) {
    const p = add('panel', { left: x, top: y, width: w, height: h, borderRadius: radius, ...st });
    const k = Math.max(w / 1200, h / 630) * zoom, iw = 1200 * k, ih = 630 * k;
    let l = tx - focal[0] / 100 * iw, t = ty - focal[1] / 100 * ih; l = Math.min(0, Math.max(w - iw, l)); t = Math.min(0, Math.max(h - ih, t));
    p.innerHTML = `<img src="../../v3/photos/${src}.webp" style="width:${iw}px;height:${ih}px;left:${l}px;top:${t}px">`; return p;
  }

  // 1 The HT gradient (same on every cover). Opacity is deliberately partial so it reads as a see-through wash.
  function htBackground(o = {}) {
    add('abs', { inset: 0, background: 'linear-gradient(180deg, #e9f2ff 0%, #d3e4fd 100%)' });
    add('abs', { inset: 0, background: 'radial-gradient(90% 110% at 100% 0%, rgba(46,100,253,.95) 0%, rgba(46,100,253,.6) 32%, rgba(46,100,253,0) 72%)' });
    add('abs', { inset: 0, background: 'radial-gradient(75% 95% at 0% 100%, rgba(19,68,253,.9) 0%, rgba(19,68,253,.5) 35%, rgba(19,68,253,0) 72%)' });
    add('abs', { inset: 0, background: 'linear-gradient(0deg, rgba(85,224,250,.8) 0%, rgba(2,208,253,.35) 20%, rgba(2,208,253,0) 40%)' });
    add('abs', { inset: 0, background: 'radial-gradient(34% 44% at 46% 36%, rgba(255,255,255,.6), rgba(255,255,255,0) 70%)' });
    if (o.waves !== false) svg(`<path d="M0 560 C 260 500, 520 600, 820 540 S 1120 500, 1200 520 L1200 630 L0 630Z" fill="#fff" opacity=".18"/>
      <path d="M0 600 C 300 560, 600 630, 900 585 S 1150 570, 1200 580 L1200 630 L0 630Z" fill="#fff" opacity=".22"/>`);
  }
  htBackground(SCENES[s.id] && SCENES[s.id].bg || {});
  const ctx = { c, P, add, svg, ico, glass, solid, tile, capsules, ghost, stripes, photo, htIcon };
  (SCENES[s.id] || { draw: () => {} }).draw(ctx);
  // Logo, bottom-left, same on every cover (hidden by the listing panel, visible on social shares).
  const lg = document.createElement('img'); lg.src = '../../v3/assets/ht-logo.svg'; Object.assign(lg.style, { position: 'absolute', left: '48px', top: '566px', height: '36px', opacity: '.95' }); c.appendChild(lg);
</script></body></html>
